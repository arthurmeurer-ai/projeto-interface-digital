<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aprimorando Interfaces Digitais</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <div class="container">
            <h1>Painel de Experiência</h1>
            <button id="theme-toggle" aria-label="Alternar entre modo claro e escuro">🌙 Modo Escuro</button>
        </div>
    </header>

    <main class="container main-content">
        <section class="card">
            <h2>Sobre o Projeto</h2>
            <p>Este painel demonstra melhorias em interfaces digitais, focando em usabilidade, transições suaves, contraste adequado e acessibilidade.</p>
            <button id="action-btn" class="btn-primary">Clique para Interagir</button>
            <span id="feedback-msg" class="sr-only" aria-live="polite"></span>
        </section>

        <section class="card">
            <h2>Métricas de Usabilidade</h2>
            <ul class="metrics-list">
                <li><strong>Contraste:</strong> Otimizado</li>
                <li><strong>Acessibilidade:</strong> WCAG AAA</li>
                <li><strong>Feedback Visual:</strong> Imediato</li>
            </ul>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
